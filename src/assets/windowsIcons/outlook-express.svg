<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="envBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#dde8f8"/>
    </linearGradient>
    <linearGradient id="envFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5580d8"/>
      <stop offset="100%" stop-color="#2255b0"/>
    </linearGradient>
    <linearGradient id="birdBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3468d8"/>
      <stop offset="100%" stop-color="#0c35a8"/>
    </linearGradient>
  </defs>

  <!-- Envelope shadow -->
  <rect x="11" y="22" width="34" height="24" rx="2" fill="rgba(0,0,0,0.18)"/>

  <!-- Envelope body -->
  <rect x="9" y="20" width="34" height="24" rx="2" fill="url(#envBody)" stroke="#a8c0e0" stroke-width="0.6"/>

  <!-- Envelope flap (V pointing down) - filled -->
  <path d="M9 20 L26 31 L43 20 Z" fill="url(#envFlap)"/>
  <!-- Flap outline crease -->
  <path d="M9 20 L26 31 L43 20" fill="none" stroke="#3055a0" stroke-width="0.5"/>

  <!-- Bottom corner fold lines -->
  <line x1="9"  y1="44" x2="20" y2="32" stroke="#98b8d8" stroke-width="0.6"/>
  <line x1="43" y1="44" x2="32" y2="32" stroke="#98b8d8" stroke-width="0.6"/>

  <!-- ═══ BIRD ═══ -->
  <!-- Tail (forked, left side) — drawn first so body covers the join -->
  <path d="M8 18 Q2 13 3  9 Q6 14 10 13 Z" fill="#0930a0"/>
  <path d="M8 20 Q1 17 2 13 Q7 17 10 16 Z" fill="#0930a0"/>

  <!-- Wing sweep upward -->
  <path d="M11 14 Q7 5 20 9 Q13 7 13 15 Z" fill="#0c38b0"/>

  <!-- Bird body (elongated, angled right-downward) -->
  <path d="M8 18 Q15 9 27 13 Q21 10 20 18 Q14 16 8 18 Z" fill="url(#birdBody)"/>

  <!-- Belly highlight -->
  <path d="M14 16 Q20 11 26 14 Q21 12 20 17 Q17 15 14 16 Z" fill="#6090e0" opacity="0.55"/>

  <!-- Head -->
  <circle cx="27" cy="12" r="4.2" fill="#1448c4"/>

  <!-- Beak -->
  <path d="M31 11 L37 12 L31 13.5 Z" fill="#d8a020"/>

  <!-- Eye -->
  <circle cx="28.5" cy="10.8" r="1.4" fill="white"/>
  <circle cx="28.9" cy="10.8" r="0.7"  fill="#001040"/>

  <!-- Wing highlight edge -->
  <path d="M12 13 Q8 7 18 10 Q13 8 14 14 Z" fill="#4878e0" opacity="0.5"/>
</svg>
